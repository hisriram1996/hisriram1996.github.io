<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper footer-inner">
    <div class="footer-brand">
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
        <span class="site-mark" aria-hidden="true">SI</span>
        <span>Sriram's IT Blog</span>
      </a>
      <p>{{ site.description | escape }}</p>
    </div>
    <div class="footer-links">
      <div>
        <strong>Explore</strong>
        <a href="{{ '/' | relative_url }}">Blog</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </div>
      <div>
        <strong>Connect</strong>
        <a href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}">RSS feed</a>
        {%- if site.author.email -%}
        <a class="u-email" href="mailto:{{ site.author.email }}">Email</a>
        {%- endif %}
      </div>
    </div>
  </div>
  <div class="wrapper footer-bottom">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name | escape }}</span>
    <div class="social-links">{%- include social.html -%}</div>
  </div>
</footer>
