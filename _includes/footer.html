<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper footer-inner">
    <div class="newsletter-copy">
      <span class="eyebrow">Stay up to date</span>
      <h2>Subscribe to my latest blogs</h2>
      <p>Get an email when a new cloud, networking, or infrastructure article is published.</p>
    </div>
    <form class="newsletter-form" action="https://formsubmit.co/{{ site.author.email }}" method="post">
      <input type="hidden" name="_subject" value="New IT blog newsletter subscriber">
      <input type="hidden" name="_captcha" value="false">
      <input class="newsletter-honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off">
      <label for="newsletter-email">Email address</label>
      <div class="newsletter-fields">
        <input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button type="submit">Subscribe</button>
      </div>
      <small>No spam. Unsubscribe at any time.</small>
    </form>
  </div>
  <div class="wrapper footer-bottom">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name | escape }}</span>
    <div class="social-links">{%- include social.html -%}</div>
  </div>
</footer>
